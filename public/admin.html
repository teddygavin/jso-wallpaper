<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>JSO Admin — Add Product</title>
  <meta name="robots" content="noindex, nofollow"/>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500&family=Playfair+Display:wght@700&display=swap" rel="stylesheet"/>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --red: #C0392B; --teal: #1E7070; --black: #111110;
      --offwhite: #F5F3F0; --mid: #E8E4DE; --muted: #7A7670; --white: #fff;
    }
    body { font-family: 'DM Sans', sans-serif; background: var(--offwhite); color: var(--black); min-height: 100vh; }

    /* ── LOCK SCREEN ── */
    #lockScreen {
      position: fixed; inset: 0; background: var(--black);
      display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 1.5rem; z-index: 999;
    }
    .lock-logo { font-family: 'Playfair Display', serif; font-size: 28px; color: var(--white); letter-spacing: 2px; }
    .lock-logo span { color: var(--red); }
    .lock-sub { font-size: 11px; letter-spacing: 4px; text-transform: uppercase; color: rgba(255,255,255,.4); }
    .lock-input {
      width: 280px; padding: 12px 16px; background: rgba(255,255,255,.08);
      border: 1px solid rgba(255,255,255,.15); border-bottom: 2px solid var(--red);
      color: var(--white); font-family: 'DM Sans', sans-serif; font-size: 14px;
      outline: none; text-align: center; letter-spacing: 4px;
    }
    .lock-input::placeholder { color: rgba(255,255,255,.25); letter-spacing: 2px; }
    .lock-btn {
      width: 280px; padding: 13px; background: var(--red); color: var(--white);
      border: none; font-family: 'DM Sans', sans-serif; font-size: 11px;
      letter-spacing: 3px; text-transform: uppercase; cursor: pointer; transition: background .3s;
    }
    .lock-btn:hover { background: #a93226; }
    .lock-err { font-size: 12px; color: #e74c3c; display: none; }

    /* ── MAIN ADMIN UI ── */
    #adminUI { display: none; }

    header {
      background: var(--black); border-bottom: 2px solid var(--red);
      padding: 0 2rem; height: 60px; display: flex; align-items: center; justify-content: space-between;
    }
    .hd-brand { font-family: 'Playfair Display', serif; font-size: 16px; color: var(--white); }
    .hd-brand span { color: var(--red); }
    .hd-badge {
      font-size: 9px; letter-spacing: 3px; text-transform: uppercase;
      background: var(--teal); color: var(--white); padding: 5px 12px;
    }
    .hd-logout {
      font-size: 10px; letter-spacing: 2px; text-transform: uppercase;
      color: rgba(255,255,255,.4); cursor: pointer; border: none; background: none;
      font-family: 'DM Sans', sans-serif; transition: color .2s;
    }
    .hd-logout:hover { color: var(--red); }

    .admin-layout {
      max-width: 1100px; margin: 2.5rem auto; padding: 0 2rem;
      display: grid; grid-template-columns: 1.1fr 1fr; gap: 2rem;
    }

    .panel {
      background: var(--white); border-top: 3px solid var(--red); padding: 2rem;
    }
    .panel-title {
      font-family: 'Playfair Display', serif; font-size: 22px; color: var(--black);
      margin-bottom: 1.75rem; padding-bottom: .75rem; border-bottom: 1px solid var(--mid);
    }

    /* ── FORM ── */
    .fg { display: flex; flex-direction: column; gap: 5px; margin-bottom: 1rem; }
    .fl { font-size: 9px; letter-spacing: 3px; text-transform: uppercase; color: var(--muted); }
    .fi {
      background: var(--offwhite); border: 1px solid var(--mid);
      border-bottom: 2px solid var(--mid); padding: 10px 13px;
      font-family: 'DM Sans', sans-serif; font-size: 13px; color: var(--black);
      outline: none; transition: border-color .3s; width: 100%;
    }
    .fi:focus { border-bottom-color: var(--red); background: var(--white); }
    .fi::placeholder { color: #bbb; }
    select.fi { appearance: none; cursor: pointer; }
    textarea.fi { resize: vertical; height: 80px; }
    .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; }

    /* image drop zone */
    .drop-zone {
      border: 2px dashed var(--mid); background: var(--offwhite);
      padding: 2rem; text-align: center; cursor: pointer;
      transition: border-color .3s; position: relative;
    }
    .drop-zone:hover, .drop-zone.drag-over { border-color: var(--red); }
    .drop-zone input[type=file] {
      position: absolute; inset: 0; opacity: 0; cursor: pointer; width: 100%; height: 100%;
    }
    .dz-icon { font-size: 32px; margin-bottom: .5rem; }
    .dz-text { font-size: 12px; color: var(--muted); line-height: 1.7; }
    .dz-text strong { color: var(--black); }
    #imgPreview {
      width: 100%; height: 180px; object-fit: cover;
      display: none; margin-top: .75rem; border: 1px solid var(--mid);
    }

    .submit-btn {
      width: 100%; padding: 13px; background: var(--red); color: var(--white);
      border: none; font-family: 'DM Sans', sans-serif; font-size: 11px;
      letter-spacing: 3px; text-transform: uppercase; cursor: pointer;
      transition: background .3s; margin-top: .5rem;
    }
    .submit-btn:hover:not(:disabled) { background: #a93226; }
    .submit-btn:disabled { opacity: .6; cursor: not-allowed; }

    /* ── FEEDBACK ── */
    .toast {
      padding: 1rem 1.25rem; font-size: 13px; margin-top: 1rem;
      display: none; border-left: 4px solid;
    }
    .toast.success { background: rgba(30,112,112,.08); border-color: var(--teal); color: var(--teal); }
    .toast.error   { background: rgba(192,57,43,.08);  border-color: var(--red);  color: var(--red);  }

    /* ── PRODUCT LIST ── */
    .prod-list { display: flex; flex-direction: column; gap: .75rem; }
    .prod-row-item {
      display: grid; grid-template-columns: 56px 1fr auto;
      gap: 1rem; align-items: center; padding: .875rem 1rem;
      background: var(--offwhite); border-bottom: 2px solid transparent; transition: border-color .3s;
    }
    .prod-row-item:hover { border-bottom-color: var(--red); }
    .prod-thumb {
      width: 56px; height: 56px; object-fit: cover;
      background: var(--mid); display: flex; align-items: center; justify-content: center;
      font-size: 22px; border: 1px solid var(--mid);
    }
    .prod-thumb img { width: 100%; height: 100%; object-fit: cover; }
    .prod-info-sm .prod-name { font-size: 14px; font-weight: 500; color: var(--black); }
    .prod-info-sm .prod-meta { font-size: 11px; color: var(--muted); margin-top: 2px; }
    .prod-price-sm { font-family: 'Playfair Display', serif; font-size: 16px; color: var(--red); white-space: nowrap; }
    .del-btn {
      background: none; border: none; cursor: pointer; color: rgba(192,57,43,.4);
      font-size: 18px; padding: 4px 8px; transition: color .2s;
    }
    .del-btn:hover { color: var(--red); }
    .empty-list { text-align: center; padding: 2rem; color: var(--muted); font-size: 13px; }

    /* loading spinner */
    .spinner { display: inline-block; width: 16px; height: 16px; border: 2px solid rgba(255,255,255,.3); border-top-color: #fff; border-radius: 50%; animation: spin .7s linear infinite; vertical-align: middle; margin-right: 6px; }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>

<!-- ══ LOCK SCREEN ══ -->
<div id="lockScreen">
  <div class="lock-logo">JSO <span>Admin</span></div>
  <div class="lock-sub">Restricted Access</div>
  <input class="lock-input" id="pwInput" type="password" placeholder="Enter admin password" autocomplete="current-password"/>
  <button class="lock-btn" id="unlockBtn">Unlock Dashboard</button>
  <div class="lock-err" id="lockErr">❌ Wrong password. Try again.</div>
</div>

<!-- ══ MAIN ADMIN UI ══ -->
<div id="adminUI">
  <header>
    <div class="hd-brand">JSO <span>·</span> Admin Dashboard</div>
    <div style="display:flex;align-items:center;gap:1.25rem;">
      <span class="hd-badge">J.S.O Wallpaper & Interiors</span>
      <button class="hd-logout" id="logoutBtn">🔒 Lock</button>
    </div>
  </header>

  <div class="admin-layout">

    <!-- ── LEFT: ADD PRODUCT FORM ── -->
    <div class="panel">
      <div class="panel-title">Add New Product</div>
      <form id="addForm">
        <div class="fg">
          <label class="fl" for="pName">Product Name *</label>
          <input class="fi" id="pName" name="name" type="text" placeholder="e.g. Arabesque Coral Wallpaper" required/>
        </div>
        <div class="form-row">
          <div class="fg">
            <label class="fl" for="pCat">Category *</label>
            <select class="fi" id="pCat" name="category_slug" required>
              <option value="">— Select —</option>
              <option value="wallpapers">🖼️ Wallpapers</option>
              <option value="window-film">🪟 Window Film & Privacy Film</option>
              <option value="carpet-grass">🌿 Carpet Grass</option>
              <option value="artificial-fence-plants">🌱 Artificial Fence & Plants</option>
              <option value="flowers">🌸 Flowers</option>
              <option value="decor-books">📚 Décor Books</option>
              <option value="decor-pieces">🏺 Décor Pieces</option>
              <option value="household-items">🏠 Household Items</option>
              <option value="bedsheets-towels">🛏️ Bedsheets & Towels</option>
              <option value="hanging-racks">🪝 Hanging Racks</option>
            </select>
          </div>
          <div class="fg">
            <label class="fl" for="pBadge">Badge</label>
            <select class="fi" id="pBadge" name="badge">
              <option value="">None</option>
              <option value="New">New</option>
              <option value="Popular">Popular</option>
              <option value="Bestseller">Bestseller</option>
            </select>
          </div>
        </div>
        <div class="form-row">
          <div class="fg">
            <label class="fl" for="pPrice">Price (KSh)</label>
            <input class="fi" id="pPrice" name="price" type="number" placeholder="8500"/>
          </div>
          <div class="fg">
            <label class="fl" for="pUnit">Unit</label>
            <input class="fi" id="pUnit" name="unit" type="text" placeholder="per roll"/>
          </div>
        </div>
        <div class="fg">
          <label class="fl" for="pDesc">Description</label>
          <textarea class="fi" id="pDesc" name="description" placeholder="Short product description shown on the website..."></textarea>
        </div>

        <!-- Image drop zone -->
        <div class="fg">
          <label class="fl">Product Image (uploads to Cloudinary)</label>
          <div class="drop-zone" id="dropZone">
            <input type="file" id="pImage" name="image" accept="image/jpeg,image/png,image/webp"/>
            <div class="dz-icon">📷</div>
            <div class="dz-text"><strong>Click to choose</strong> or drag & drop<br/>JPG, PNG or WebP · max 10 MB</div>
          </div>
          <img id="imgPreview" alt="Preview"/>
        </div>

        <button class="submit-btn" type="submit" id="addBtn">Add Product</button>
        <div class="toast" id="addToast"></div>
      </form>
    </div>

    <!-- ── RIGHT: LIVE PRODUCT LIST ── -->
    <div class="panel">
      <div class="panel-title">Products in Database</div>
      <div class="prod-list" id="prodList">
        <div class="empty-list">Loading products…</div>
      </div>
    </div>

  </div>
</div>

<script>
  /* ══ PASSWORD GATE ══ */
  let ADMIN_PW = '';

  document.getElementById('unlockBtn').addEventListener('click', tryUnlock);
  document.getElementById('pwInput').addEventListener('keydown', e => { if (e.key === 'Enter') tryUnlock(); });

  function tryUnlock() {
    const pw = document.getElementById('pwInput').value.trim();
    if (!pw) return;
    // Test the password against the API
    fetch('/api/products?limit=1', { headers: { 'X-Admin-Password': pw } })
      .then(r => {
        // A valid password doesn't change GET behaviour — we test POST auth instead
        return fetch('/api/products', {
          method: 'POST',
          headers: { 'X-Admin-Password': pw },
          body: (() => { const f = new FormData(); f.append('_test','1'); return f; })()
        });
      })
      .then(r => {
        // 400 = auth passed but missing fields (expected) | 401 = wrong password
        if (r.status === 400 || r.status === 201) {
          ADMIN_PW = pw;
          document.getElementById('lockScreen').style.display = 'none';
          document.getElementById('adminUI').style.display = 'block';
          loadProducts();
        } else {
          showLockErr();
        }
      })
      .catch(() => {
        // If server not running, trust the password and proceed (local dev)
        ADMIN_PW = pw;
        document.getElementById('lockScreen').style.display = 'none';
        document.getElementById('adminUI').style.display = 'block';
        loadProducts();
      });
  }

  function showLockErr() {
    const e = document.getElementById('lockErr');
    e.style.display = 'block';
    setTimeout(() => e.style.display = 'none', 3000);
  }

  document.getElementById('logoutBtn').addEventListener('click', () => {
    ADMIN_PW = '';
    document.getElementById('lockScreen').style.display = 'flex';
    document.getElementById('adminUI').style.display = 'none';
    document.getElementById('pwInput').value = '';
  });

  /* ══ IMAGE PREVIEW ══ */
  document.getElementById('pImage').addEventListener('change', function () {
    const file = this.files[0];
    if (!file) return;
    const preview = document.getElementById('imgPreview');
    preview.src = URL.createObjectURL(file);
    preview.style.display = 'block';
  });

  const dropZone = document.getElementById('dropZone');
  dropZone.addEventListener('dragover', e => { e.preventDefault(); dropZone.classList.add('drag-over'); });
  dropZone.addEventListener('dragleave', () => dropZone.classList.remove('drag-over'));
  dropZone.addEventListener('drop', e => {
    e.preventDefault();
    dropZone.classList.remove('drag-over');
    const file = e.dataTransfer.files[0];
    if (file) {
      document.getElementById('pImage').files = e.dataTransfer.files;
      const preview = document.getElementById('imgPreview');
      preview.src = URL.createObjectURL(file);
      preview.style.display = 'block';
    }
  });

  /* ══ ADD PRODUCT ══ */
  document.getElementById('addForm').addEventListener('submit', async function (e) {
    e.preventDefault();
    const btn   = document.getElementById('addBtn');
    const toast = document.getElementById('addToast');
    btn.innerHTML = '<span class="spinner"></span> Uploading to Cloudinary…';
    btn.disabled = true;
    toast.style.display = 'none';

    const formData = new FormData(this);
    // Auto-generate price_label from price
    const price = formData.get('price');
    if (price) formData.set('price_label', `KSh ${Number(price).toLocaleString()}`);

    try {
      const res = await fetch('/api/products', {
        method: 'POST',
        headers: { 'X-Admin-Password': ADMIN_PW },
        body: formData  // DO NOT set Content-Type — browser sets multipart boundary automatically
      });
      const data = await res.json();

      if (res.ok && data.success) {
        toast.className = 'toast success';
        toast.innerHTML = `✓ <strong>${formData.get('name')}</strong> added!${data.image_url ? ` <a href="${data.image_url}" target="_blank" style="color:var(--teal)">View image ↗</a>` : ''}`;
        toast.style.display = 'block';
        this.reset();
        document.getElementById('imgPreview').style.display = 'none';
        loadProducts();
      } else {
        throw new Error(data.error || 'Unknown error');
      }
    } catch (err) {
      toast.className = 'toast error';
      toast.textContent = '❌ Error: ' + err.message;
      toast.style.display = 'block';
    }

    btn.innerHTML = 'Add Product';
    btn.disabled = false;
  });

  /* ══ LOAD & DISPLAY PRODUCTS ══ */
  async function loadProducts() {
    const list = document.getElementById('prodList');
    list.innerHTML = '<div class="empty-list">Loading…</div>';

    try {
      const r    = await fetch('/api/products?limit=60');
      const data = await r.json();
      if (!data.data || !data.data.length) {
        list.innerHTML = '<div class="empty-list">No products yet. Add one!</div>';
        return;
      }
      list.innerHTML = data.data.map(p => `
        <div class="prod-row-item">
          <div class="prod-thumb">
            ${p.image
              ? `<img src="${p.image}" alt="${p.name}" loading="lazy"/>`
              : getCatEmoji(p.category_slug)}
          </div>
          <div class="prod-info-sm">
            <div class="prod-name">${p.name}</div>
            <div class="prod-meta">${p.category_slug} · ${p.badge || 'no badge'} · ${p.in_stock ? 'In stock' : 'Out of stock'}</div>
          </div>
          <div style="display:flex;flex-direction:column;align-items:flex-end;gap:6px;">
            <span class="prod-price-sm">${p.price_label || '—'}</span>
            <button class="del-btn" onclick="deleteProduct(${p.id}, '${p.name.replace(/'/g,"\\'")}')">🗑</button>
          </div>
        </div>
      `).join('');
    } catch {
      list.innerHTML = '<div class="empty-list">Could not load products.</div>';
    }
  }

  /* ══ DELETE PRODUCT ══ */
  async function deleteProduct(id, name) {
    if (!confirm(`Delete "${name}"? This cannot be undone.`)) return;
    try {
      const r = await fetch(`/api/products/${id}`, {
        method: 'DELETE',
        headers: { 'X-Admin-Password': ADMIN_PW }
      });
      const d = await r.json();
      if (d.success) loadProducts();
      else alert('Delete failed: ' + d.error);
    } catch { alert('Server error during delete.'); }
  }

  function getCatEmoji(slug) {
    const map = {
      'wallpapers':'🖼️','window-film':'🪟','carpet-grass':'🌿',
      'artificial-fence-plants':'🌱','flowers':'🌸','decor-books':'📚',
      'decor-pieces':'🏺','household-items':'🏠','bedsheets-towels':'🛏️','hanging-racks':'🪝'
    };
    return map[slug] || '📦';
  }
</script>
</body>
</html>
